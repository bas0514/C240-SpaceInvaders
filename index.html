<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Invaders Foundation</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
    }

    canvas {
      display: block;
      width: 800px;
      height: 600px;
      background: #000;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const context = canvas.getContext("2d");

    const player = {
      x: canvas.width / 2,
      y: canvas.height - 40,
      width: 44,
      height: 28,
      speed: 260
    };

    const invaderSprites = [
      [
        ["00011100000", "00111110000", "01111111000", "11011011000", "11111111100", "00100100000", "01011010000", "10000001000"],
        ["00011100000", "00111110000", "01111111000", "11011011000", "11111111100", "00100100000", "01011010000", "00100100000"]
      ],
      [
        ["00100001000", "00010010000", "00111111000", "01101101100", "11111111110", "10111111110", "10100000100", "00011011000"],
        ["00100001000", "10010010100", "10111111100", "11101101110", "11111111110", "00111111000", "00100001000", "01000000100"]
      ],
      [
        ["00001110000", "00111111100", "01111111110", "11101110111", "11111111111", "00110101100", "01100100110", "11000000011"],
        ["00001110000", "00111111100", "01111111110", "11101110111", "11111111111", "00110101100", "01000100010", "00100000100"]
      ]
    ];

    const invaders = [];
    const shots = [];
    const enemyShots = [];
    const explosions = [];
    const invaderColumns = 11;
    const invaderRows = 5;
    const invaderRowColors = ["#ff4d4d", "#ff9f0a", "#ffd60a", "#32d74b", "#0a84ff"];
    const invaderStep = 12;
    let invaderDirection = 1;
    let invaderStepTimer = 0;
    let animationFrame = 0;
    let shotCooldown = 0;
    let enemyFireTimer = 1.3 + Math.random();
    let lives = 3;
    let score = 0;
    let playerHitTimer = 0;
    let gameOver = false;

    const keys = {
      left: false,
      right: false,
      fire: false
    };

    function createInvaders() {
      invaders.length = 0;

      const startX = (canvas.width - (invaderColumns - 1) * 52) / 2;
      for (let row = 0; row < invaderRows; row += 1) {
        const spriteType = row === 0 ? 0 : row < 3 ? 1 : 2;
        for (let column = 0; column < invaderColumns; column += 1) {
          invaders.push({
            x: startX + column * 52,
            y: 92 + row * 42,
            spriteType,
            row
          });
        }
      }
    }

    function restartGame() {
      player.x = canvas.width / 2;
      player.y = canvas.height - 40;
      invaders.length = 0;
      shots.length = 0;
      enemyShots.length = 0;
      explosions.length = 0;
      invaderDirection = 1;
      invaderStepTimer = 0;
      animationFrame = 0;
      shotCooldown = 0;
      enemyFireTimer = 1.3 + Math.random();
      lives = 3;
      score = 0;
      playerHitTimer = 0;
      gameOver = false;
      keys.left = false;
      keys.right = false;
      keys.fire = false;
      createInvaders();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function arcadeColorAt(y) {
      if (y < 170) return "#ff5555";
      if (y >= 390) return "#62ff73";
      return "#f4f4f4";
    }

    window.addEventListener("keydown", (event) => {
      if (gameOver) {
        if (event.key.toLowerCase() === "r") {
          restartGame();
          event.preventDefault();
        }
        return;
      }

      if (event.key === "ArrowLeft") {
        keys.left = true;
        event.preventDefault();
      } else if (event.key === "ArrowRight") {
        keys.right = true;
        event.preventDefault();
      } else if (event.code === "Space") {
        keys.fire = true;
        event.preventDefault();
      }
    });

    window.addEventListener("keyup", (event) => {
      if (event.key === "ArrowLeft") {
        keys.left = false;
        event.preventDefault();
      } else if (event.key === "ArrowRight") {
        keys.right = false;
        event.preventDefault();
      } else if (event.code === "Space") {
        keys.fire = false;
        event.preventDefault();
      }
    });

    window.addEventListener("blur", () => {
      keys.left = false;
      keys.right = false;
      keys.fire = false;
    });

    function drawPlayer() {
      context.save();
      const flashing = playerHitTimer > 0 && Math.floor(playerHitTimer * 12) % 2 === 0;
      context.fillStyle = flashing ? "#fff" : arcadeColorAt(player.y);
      context.translate(player.x, player.y);

      context.beginPath();
      context.moveTo(0, -player.height / 2);
      context.lineTo(player.width / 2, player.height / 2);
      context.lineTo(-player.width / 2, player.height / 2);
      context.closePath();
      context.fill();

      context.restore();
    }

    function drawInvader(invader) {
      const sprite = invaderSprites[invader.spriteType][animationFrame];
      const pixelSize = 4;
      const width = sprite[0].length * pixelSize;
      const height = sprite.length * pixelSize;

      context.fillStyle = invaderRowColors[invader.row];
      for (let row = 0; row < sprite.length; row += 1) {
        for (let column = 0; column < sprite[row].length; column += 1) {
          if (sprite[row][column] === "1") {
            context.fillRect(
              Math.round(invader.x - width / 2 + column * pixelSize),
              Math.round(invader.y - height / 2 + row * pixelSize),
              pixelSize,
              pixelSize
            );
          }
        }
      }
    }

    function fireShot() {
      shots.push({
        x: player.x,
        y: player.y - player.height / 2,
        speed: 480,
        width: 4,
        height: 14
      });
    }

    function fireEnemyShot() {
      if (invaders.length === 0) return;

      const lowestRow = Math.max(...invaders.map((invader) => invader.y));
      const shooters = invaders.filter((invader) => invader.y === lowestRow);
      const shooter = shooters[Math.floor(Math.random() * shooters.length)];
      const dx = player.x - shooter.x;
      const dy = player.y - shooter.y;
      const distance = Math.hypot(dx, dy);
      const speed = 220;

      enemyShots.push({
        x: shooter.x,
        y: shooter.y + 16,
        velocityX: dx / distance * speed,
        velocityY: dy / distance * speed,
        width: 4,
        height: 12
      });
    }

    function createExplosion(invader) {
      const particles = [];
      for (let index = 0; index < 8; index += 1) {
        const angle = index * Math.PI / 4;
        const speed = index % 2 === 0 ? 72 : 48;
        particles.push({
          x: invader.x,
          y: invader.y,
          velocityX: Math.cos(angle) * speed,
          velocityY: Math.sin(angle) * speed,
          size: index % 2 === 0 ? 4 : 3
        });
      }

      explosions.push({
        color: invaderRowColors[invader.row],
        duration: 0.32,
        remaining: 0.32,
        particles
      });
    }

    function update(deltaTime) {
      if (gameOver) return;

      playerHitTimer = Math.max(0, playerHitTimer - deltaTime);

      let direction = 0;

      if (keys.left) direction -= 1;
      if (keys.right) direction += 1;

      player.x += direction * player.speed * deltaTime;

      const halfWidth = player.width / 2;
      player.x = Math.max(halfWidth, Math.min(canvas.width - halfWidth, player.x));

      shotCooldown = Math.max(0, shotCooldown - deltaTime);
      if (keys.fire && shotCooldown === 0) {
        fireShot();
        shotCooldown = 0.32;
      }

      invaderStepTimer += deltaTime;
      const stepInterval = Math.max(0.09, 0.52 - (invaderRows * invaderColumns - invaders.length) * 0.008);
      if (invaderStepTimer >= stepInterval) {
        invaderStepTimer -= stepInterval;
        animationFrame = 1 - animationFrame;

        const leftEdge = Math.min(...invaders.map((invader) => invader.x - 22));
        const rightEdge = Math.max(...invaders.map((invader) => invader.x + 22));
        const nextLeftEdge = leftEdge + invaderDirection * invaderStep;
        const nextRightEdge = rightEdge + invaderDirection * invaderStep;

        if (nextLeftEdge < 28 || nextRightEdge > canvas.width - 28) {
          invaderDirection *= -1;
          invaders.forEach((invader) => {
            invader.y += 14;
          });
        } else {
          invaders.forEach((invader) => {
            invader.x += invaderDirection * invaderStep;
          });
        }
      }

      if (invaders.some((invader) => invader.y + 16 >= canvas.height)) {
        gameOver = true;
        return;
      }

      for (let shotIndex = shots.length - 1; shotIndex >= 0; shotIndex -= 1) {
        const shot = shots[shotIndex];
        shot.y -= shot.speed * deltaTime;

        if (shot.y + shot.height < 0) {
          shots.splice(shotIndex, 1);
          continue;
        }

        for (let invaderIndex = invaders.length - 1; invaderIndex >= 0; invaderIndex -= 1) {
          const invader = invaders[invaderIndex];
          const hit = Math.abs(shot.x - invader.x) < 24
            && Math.abs(shot.y - invader.y) < 20;

          if (hit) {
            invaders.splice(invaderIndex, 1);
            score += 10;
            createExplosion(invader);
            shots.splice(shotIndex, 1);
            break;
          }
        }
      }

      for (let explosionIndex = explosions.length - 1; explosionIndex >= 0; explosionIndex -= 1) {
        const explosion = explosions[explosionIndex];
        explosion.remaining -= deltaTime;
        explosion.particles.forEach((particle) => {
          particle.x += particle.velocityX * deltaTime;
          particle.y += particle.velocityY * deltaTime;
        });
        if (explosion.remaining <= 0) explosions.splice(explosionIndex, 1);
      }

      enemyFireTimer -= deltaTime;
      if (enemyFireTimer <= 0 && invaders.length > 0) {
        fireEnemyShot();
        enemyFireTimer = 1.3 + Math.random() * 1.4;
      }

      for (let shotIndex = enemyShots.length - 1; shotIndex >= 0; shotIndex -= 1) {
        const shot = enemyShots[shotIndex];
        shot.x += shot.velocityX * deltaTime;
        shot.y += shot.velocityY * deltaTime;

        const leftPlayerEdge = player.x - player.width / 2;
        const rightPlayerEdge = player.x + player.width / 2;
        const topPlayerEdge = player.y - player.height / 2;
        const bottomPlayerEdge = player.y + player.height / 2;
        const hitPlayer = shot.x + shot.width / 2 >= leftPlayerEdge
          && shot.x - shot.width / 2 <= rightPlayerEdge
          && shot.y + shot.height / 2 >= topPlayerEdge
          && shot.y - shot.height / 2 <= bottomPlayerEdge;

        if (hitPlayer) {
          enemyShots.splice(shotIndex, 1);
          lives -= 1;
          playerHitTimer = 0.65;
          if (lives === 0) {
            gameOver = true;
            return;
          }
          continue;
        }

        if (shot.y - shot.height / 2 > canvas.height
          || shot.x + shot.width / 2 < 0
          || shot.x - shot.width / 2 > canvas.width) {
          enemyShots.splice(shotIndex, 1);
        }
      }
    }

    function draw() {
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = "#000";
      context.fillRect(0, 0, canvas.width, canvas.height);

      invaders.forEach(drawInvader);

      shots.forEach((shot) => {
        context.fillStyle = arcadeColorAt(shot.y);
        context.fillRect(
          Math.round(shot.x - shot.width / 2),
          Math.round(shot.y - shot.height / 2),
          shot.width,
          shot.height
        );
      });

      enemyShots.forEach((shot) => {
        context.fillStyle = arcadeColorAt(shot.y);
        context.fillRect(
          Math.round(shot.x - shot.width / 2),
          Math.round(shot.y - shot.height / 2),
          shot.width,
          shot.height
        );
      });

      explosions.forEach((explosion) => {
        context.save();
        context.globalAlpha = explosion.remaining / explosion.duration;
        context.fillStyle = explosion.color;
        explosion.particles.forEach((particle) => {
          context.fillRect(
            Math.round(particle.x - particle.size / 2),
            Math.round(particle.y - particle.size / 2),
            particle.size,
            particle.size
          );
        });
        context.restore();
      });

      drawPlayer();

      context.fillStyle = "#fff";
      context.font = "20px monospace";
      context.textAlign = "left";
      context.fillText(`SCORE: ${score}`, 20, 32);
      context.textAlign = "right";
      context.fillText(`LIVES: ${lives}`, canvas.width - 20, 32);

      if (gameOver) {
        context.fillStyle = "rgba(0, 0, 0, 0.75)";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.fillStyle = "#ff5555";
        context.font = "bold 48px monospace";
        context.textAlign = "center";
        context.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 12);
        context.fillStyle = "#fff";
        context.font = "20px monospace";
        context.fillText("Press R to Restart", canvas.width / 2, canvas.height / 2 + 32);
      }
    }

    let previousTime = 0;

    function gameLoop(currentTime) {
      const deltaTime = (currentTime - previousTime) / 1000;
      previousTime = currentTime;

      update(Math.min(deltaTime, 0.05));
      draw();
      if (!gameOver) requestAnimationFrame(gameLoop);
    }

    createInvaders();
    draw();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
